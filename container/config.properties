# Upstream supported coordinator-plus-worker test configuration.
# The operator must mount keys, trust and a per-run shared secret before startup.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.enabled=false
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/run/tls/server.pem
internal-communication.https.required=true
internal-communication.https.keystore.path=/run/tls/server.pem
internal-communication.https.truststore.path=/run/tls/ca.crt
discovery.uri=https://trino:8443
query.max-memory=256MB
query.max-memory-per-node=256MB
memory.heap-headroom-per-node=256MB
http-server.log.enabled=false
