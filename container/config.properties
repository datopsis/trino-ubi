# Upstream supported coordinator-plus-worker test configuration.
# The entrypoint refuses this unauthenticated profile without explicit opt-out.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://127.0.0.1:8080
query.max-memory=256MB
query.max-memory-per-node=256MB
memory.heap-headroom-per-node=256MB
http-server.log.enabled=false
