minimum_pre_commit_version: '4.0.0'
repos:
  - repo: local
    hooks:
      - id: repository-lint
        name: repository syntax and security invariants
        language: system
        entry: python3 scripts/lint.py
        pass_filenames: false
        always_run: true
      - id: shellcheck
        name: shellcheck
        language: system
        entry: shellcheck
        types: [shell]
      - id: lf-line-endings
        name: Reject CRLF line endings
        language: system
        entry: bash -c 'if git ls-files --eol | grep -E "^i/(crlf|mixed)"; then echo "CRLF line endings found, commit LF only (see .gitattributes)" >&2; exit 1; fi'
        pass_filenames: false
        always_run: true
